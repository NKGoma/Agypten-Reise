<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#c8a96e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>🇪🇬 Ägypten Reiseführer</title>
  <style>
    /* ── Farben & Grundeinstellungen ── */
    :root {
      --bg:         #f5e6c8;
      --sand:       #c8a96e;
      --sand-dark:  #a8894e;
      --terra:      #b85c2a;
      --terra-dark: #8f4420;
      --dark:       #2c1a0e;
      --card-bg:    #ffffff;
      --shadow:     rgba(44, 26, 14, 0.15);
      --disabled:   #c0b09a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--dark);
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 18px;
      -webkit-text-size-adjust: 100%;
      overflow-x: hidden;
    }

    /* ── Views ── */
    .view {
      display: none;
      flex-direction: column;
      min-height: 100dvh;
      min-height: 100vh;
    }
    .view.active { display: flex; }

    /* ── HOME: Header ── */
    .app-header {
      background: linear-gradient(135deg, #c8a96e 0%, #a8894e 100%);
      color: #fff;
      padding: 28px 20px 22px;
      text-align: center;
      box-shadow: 0 3px 10px var(--shadow);
    }
    .app-header h1 {
      font-size: 1.9rem;
      font-weight: bold;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }
    .app-header p {
      font-size: 1rem;
      margin-top: 6px;
      opacity: 0.9;
      font-style: italic;
    }

    /* ── HOME: Kategorie-Raster ── */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 16px;
      flex: 1;
    }

    @media (max-width: 340px) {
      .category-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .category-tile {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 4px 12px var(--shadow);
      min-height: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      border: 3px solid transparent;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      padding: 12px 8px;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .category-tile:active {
      transform: scale(0.94);
      border-color: var(--sand);
      box-shadow: 0 2px 6px var(--shadow);
    }
    .tile-emoji {
      font-size: 2.2rem;
      line-height: 1;
    }
    .tile-label {
      font-size: 0.78rem;
      font-weight: bold;
      text-align: center;
      line-height: 1.3;
      color: var(--dark);
    }

    /* ── DETAIL: Header ── */
    .detail-header {
      background: linear-gradient(135deg, #c8a96e 0%, #a8894e 100%);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 3px 10px var(--shadow);
      min-height: 68px;
    }
    #btn-back {
      background: rgba(255,255,255,0.25);
      color: #fff;
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 1rem;
      font-family: Georgia, serif;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    #btn-back:active { background: rgba(255,255,255,0.4); }

    #detail-title {
      color: #fff;
      font-size: 1.15rem;
      font-weight: bold;
      line-height: 1.25;
      flex: 1;
    }

    /* ── DETAIL: Karteikarte ── */
    .card-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px 100px; /* bottom padding for fixed nav */
      overflow: hidden;
    }

    .karteikarte {
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 6px 28px var(--shadow);
      padding: 28px 24px;
      width: 100%;
      max-width: 580px;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      /* Transition hook */
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .karteikarte.slide-out-left {
      opacity: 0;
      transform: translateX(-55px);
    }
    .karteikarte.slide-out-right {
      opacity: 0;
      transform: translateX(55px);
    }
    .karteikarte.slide-in-left {
      opacity: 0;
      transform: translateX(-55px);
      transition: none;
    }
    .karteikarte.slide-in-right {
      opacity: 0;
      transform: translateX(55px);
      transition: none;
    }

    .card-number {
      display: inline-block;
      background: var(--sand);
      color: #fff;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      font-size: 1.05rem;
      font-weight: bold;
      line-height: 38px;
      text-align: center;
      flex-shrink: 0;
      align-self: flex-start;
    }
    .card-headline {
      font-size: 1.35rem;
      font-weight: bold;
      line-height: 1.35;
      color: var(--terra);
    }
    .card-body {
      font-size: 1.08rem;
      line-height: 1.75;
      color: var(--dark);
      white-space: pre-wrap;
    }

    /* ── DETAIL: Navigationsleiste (fixed bottom) ── */
    .card-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 82px;
      background: var(--sand);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      box-shadow: 0 -3px 12px var(--shadow);
      z-index: 100;
    }

    .nav-btn {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: var(--terra);
      color: #fff;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, transform 0.1s;
      font-family: Georgia, serif;
    }
    .nav-btn:active:not(:disabled) {
      background: var(--terra-dark);
      transform: scale(0.93);
    }
    .nav-btn:disabled {
      background: var(--disabled);
      cursor: default;
    }

    #progress-label {
      font-size: 1.05rem;
      font-weight: bold;
      color: #fff;
      text-align: center;
      line-height: 1.3;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    /* ── Footer auf Startseite ── */
    .home-footer {
      text-align: center;
      padding: 12px 16px 20px;
      font-size: 0.82rem;
      color: var(--sand-dark);
      font-style: italic;
    }
  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════════ VIEW 1: STARTSEITE -->
  <div id="view-home" class="view active">
    <header class="app-header">
      <h1>🇪🇬 Ägypten Reiseführer</h1>
      <p>Tipps für eine unvergessliche Reise</p>
    </header>
    <main id="category-grid" class="category-grid" role="list">
      <!-- JS füllt hier die Kacheln ein -->
    </main>
    <footer class="home-footer">Auf eine schöne Reise! 🌙</footer>
  </div>

  <!-- ═══════════════════════════════════════════ VIEW 2: KARTEIKASTEN -->
  <div id="view-detail" class="view" role="region" aria-label="Tipps">
    <header class="detail-header">
      <button id="btn-back" aria-label="Zurück zur Übersicht">← Zurück</button>
      <h2 id="detail-title"></h2>
    </header>
    <div class="card-container" id="card-container">
      <div id="card" class="karteikarte" role="article">
        <span class="card-number" id="card-number" aria-hidden="true"></span>
        <h3 class="card-headline" id="card-headline"></h3>
        <p class="card-body" id="card-body"></p>
      </div>
    </div>
    <nav class="card-nav" aria-label="Karten blättern">
      <button id="btn-prev" class="nav-btn" aria-label="Vorheriger Tipp">&#8592;</button>
      <span id="progress-label" aria-live="polite"></span>
      <button id="btn-next" class="nav-btn" aria-label="Nächster Tipp">&#8594;</button>
    </nav>
  </div>

  // ════════════════════════════════════════════════════════════
  //  APP-ZUSTAND
  // ════════════════════════════════════════════════════════════

  const state = {
    currentView: 'home',
    currentCategory: null,
    currentCard: 0,
    animating: false
  };

  // ════════════════════════════════════════════════════════════
  //  DOM-REFERENZEN
  // ════════════════════════════════════════════════════════════

  const viewHome       = document.getElementById('view-home');
  const viewDetail     = document.getElementById('view-detail');
  const categoryGrid   = document.getElementById('category-grid');
  const detailTitle    = document.getElementById('detail-title');
  const card           = document.getElementById('card');
  const cardNumber     = document.getElementById('card-number');
  const cardHeadline   = document.getElementById('card-headline');
  const cardBody       = document.getElementById('card-body');
  const progressLabel  = document.getElementById('progress-label');
  const btnBack        = document.getElementById('btn-back');
  const btnPrev        = document.getElementById('btn-prev');
  const btnNext        = document.getElementById('btn-next');
  const cardContainer  = document.getElementById('card-container');

  // ════════════════════════════════════════════════════════════
  //  VIEWS WECHSELN
  // ════════════════════════════════════════════════════════════

  function switchView(target) {
    if (target === 'home') {
      viewDetail.classList.remove('active');
      viewHome.classList.add('active');
      state.currentView = 'home';
    } else {
      viewHome.classList.remove('active');
      viewDetail.classList.add('active');
      state.currentView = 'detail';
    }
  }

  // ════════════════════════════════════════════════════════════
  //  STARTSEITE AUFBAUEN
  // ════════════════════════════════════════════════════════════

  function renderHome() {
    categoryGrid.innerHTML = '';
    CATEGORIES.forEach(function(cat, idx) {
      const tile = document.createElement('div');
      tile.className = 'category-tile';
      tile.setAttribute('role', 'listitem');
      tile.setAttribute('tabindex', '0');
      tile.setAttribute('aria-label', cat.label.replace('\n', ' '));

      const emojiEl = document.createElement('span');
      emojiEl.className = 'tile-emoji';
      emojiEl.setAttribute('aria-hidden', 'true');
      emojiEl.textContent = cat.emoji;

      const labelEl = document.createElement('span');
      labelEl.className = 'tile-label';
      labelEl.textContent = cat.label.replace('\n', '\n');
      labelEl.style.whiteSpace = 'pre-line';

      tile.appendChild(emojiEl);
      tile.appendChild(labelEl);

      tile.addEventListener('click', function() { navigateTo(idx); });
      tile.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); navigateTo(idx); }
      });

      categoryGrid.appendChild(tile);
    });
  }

  // ════════════════════════════════════════════════════════════
  //  KARTEIKARTE ANZEIGEN
  // ════════════════════════════════════════════════════════════

  function renderCard() {
    const cat  = CATEGORIES[state.currentCategory];
    const tip  = cat.cards[state.currentCard];
    const total = cat.cards.length;
    const idx   = state.currentCard;

    detailTitle.textContent  = cat.emoji + ' ' + cat.label.replace('\n', ' ');
    cardNumber.textContent   = idx + 1;
    cardHeadline.textContent = tip.headline;
    cardBody.textContent     = tip.body;
    progressLabel.textContent = 'Tipp ' + (idx + 1) + ' von ' + total;

    btnPrev.disabled = (idx === 0);
    btnNext.disabled = (idx === total - 1);
  }

  // ════════════════════════════════════════════════════════════
  //  NAVIGATION
  // ════════════════════════════════════════════════════════════

  function navigateTo(categoryIdx) {
    state.currentCategory = categoryIdx;
    state.currentCard     = 0;
    switchView('detail');
    renderCard();
    // Karte sauber einblenden
    card.style.opacity = '1';
    card.style.transform = 'none';
    card.style.transition = '';
    btnBack.focus();
  }

  function navigateHome() {
    switchView('home');
    state.currentCategory = null;
    state.currentCard     = 0;
  }

  // ════════════════════════════════════════════════════════════
  //  KARTE BLÄTTERN MIT ANIMATION
  // ════════════════════════════════════════════════════════════

  function changeCard(direction) {
    if (state.animating) return;
    const cat = CATEGORIES[state.currentCategory];
    const newIdx = state.currentCard + direction;
    if (newIdx < 0 || newIdx >= cat.cards.length) return;

    state.animating = true;

    // Phase 1: rausschieben
    const outClass = direction > 0 ? 'slide-out-left' : 'slide-out-right';
    card.classList.add(outClass);

    setTimeout(function() {
      // Phase 2: Inhalt aktualisieren, während Karte unsichtbar
      state.currentCard = newIdx;
      renderCard();

      // Phase 3: von der anderen Seite einblenden (ohne Transition)
      card.classList.remove(outClass);
      const inClass = direction > 0 ? 'slide-in-right' : 'slide-in-left';
      card.classList.add(inClass);

      // Phase 4: Transition anstossen mit doppeltem rAF
      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          card.classList.remove(inClass);
          // Freigabe nach Transition
          setTimeout(function() {
            state.animating = false;
          }, 240);
        });
      });
    }, 220);
  }

  function nextCard() { changeCard(1); }
  function prevCard() { changeCard(-1); }

  // ════════════════════════════════════════════════════════════
  //  TOUCH / WISCHEN
  // ════════════════════════════════════════════════════════════

  let touchStartX = null;

  cardContainer.addEventListener('touchstart', function(e) {
    touchStartX = e.touches[0].clientX;
  }, { passive: true });

  cardContainer.addEventListener('touchend', function(e) {
    if (touchStartX === null) return;
    const deltaX = e.changedTouches[0].clientX - touchStartX;
    touchStartX = null;
    if (Math.abs(deltaX) > 50) {
      if (deltaX < 0) nextCard();
      else prevCard();
    }
  }, { passive: true });

  // ════════════════════════════════════════════════════════════
  //  EVENT-BINDING
  // ════════════════════════════════════════════════════════════

  btnBack.addEventListener('click', navigateHome);
  btnPrev.addEventListener('click', prevCard);
  btnNext.addEventListener('click', nextCard);

  // Tastatur-Navigation in der Detailansicht
  document.addEventListener('keydown', function(e) {
    if (state.currentView !== 'detail') return;
    if (e.key === 'ArrowRight') nextCard();
    if (e.key === 'ArrowLeft')  prevCard();
    if (e.key === 'Escape')     navigateHome();
  });

  // ════════════════════════════════════════════════════════════
  //  START
  // ════════════════════════════════════════════════════════════

  renderHome();

  </script>
